[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"
[project]
name = "adversarial-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "groq",
    "transformers",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]